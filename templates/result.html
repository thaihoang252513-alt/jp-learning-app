<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Kết quả</title>
<style>
        body {
            font-family: Arial; 
            text-align: center; 
            background: url('/static/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            width: 100vw;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{background:rgba(255, 255, 255, 0.95);padding:40px;border-radius:10px;display:inline-block;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
        a{text-decoration:none;padding:10px 20px;background:#007BFF;color:#fff;border-radius:5px;display:inline-block;margin-top:15px}
</style>
</head>
<body>
<div class="card">
    <h2>🎉 Hoàn thành bài học!</h2>
    <p>Số câu trả lời đúng của bạn: <b>{{ score }} / {{ total }}</b></p>
    <a href="/">Làm lại từ đầu</a>
</div>
</body>
</html>
